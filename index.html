function hashPass(pw){
const s = 'wm$' + pw + '$v2';
let a = 0x811c9dc5, b = 0x1000193, c = 7;
for(let i=0;i<s.length;i++){
const k = s.charCodeAt(i);
a = ((a ^ k) * 16777619) >>> 0;
b = ((b + k * (i + 7)) * 2654435761) >>> 0;
c = (c * 31 + k) >>> 0;
}
return a.toString(16) + b.toString(16) + c.toString(16) + '.' + s.length.toString(16);
}

function doWithdraw(){

closeSheet(); render();
toast(t('withdrawOk'),'ok');

function callApi(action, extra){
if(!hasApi()) return Promise.resolve({ok:false, error:(LANG==='cn'?'请先填写接口地址与密钥':'Add the API address and key first')});
const body = Object.assign({action:action, token:apiToken()}, extra || {});
return fetch(apiBase(), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
.then(function(r){ return r.json(); })
.then(function(d){
if(d && d.ok === false && d.error){ toast(d.error,'err'); }
if(d && Array.isArray(d.rights)){ S.rights = d.rights; }
return d;
})
.catch(function(e){ toast((LANG==='cn'?'无法连接接口':'Cannot reach the API'),'err'); return {ok:false, error:'network'}; });
}

function ago(ts){
if(!ts) return '—';
const s = Math.floor((Date.now()/1000) - ts);
if(s < 60) return s + 's';
if(s < 3600) return Math.floor(s/60) + 'm';
if(s < 86400) return Math.floor(s/3600) + 'h';
return Math.floor(s/86400) + 'd';
}

function when(ts){
try{
if(!ts) return '—';
var d = new Date(Number(ts)*1000);
var p = function(n){ return (n<10?'0':'')+n; };
return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}catch(e){ return '—'; }
}

function hashPw(s){
let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
for(let i=0;i<s.length;i++){
const c = s.charCodeAt(i);
h1 = ((h1 ^ c) * 16777619) >>> 0;
h2 = ((h2 + c * (i+7)) * 2654435761) >>> 0;
}
return h1.toString(16) + h2.toString(16);
}

return user.role || 'member';

}
window.hideBootErr = hideErr;
function showErr(msg){
var v = document.getElementById('view');
if(v && v.innerHTML.replace(/\s/g,'').length > 0) return;
if(document.getElementById('bootErr')) return;
var det = String(msg);
try{
if(window.__bootErrs && window.__bootErrs.length){
det = window.__bootErrs[0];
}
}catch(x){}
var box = document.createElement('div');
box.id = 'bootErr';
box.style.cssText = 'position:fixed;left:12px;right:12px;top:64px;z-index:999;background:#200d16;border:1px solid #fb7185;border-radius:14px;padding:14px;color:#fff;font-size:13px;line-height:1.5';
box.innerHTML = '<b>⚠️ The shop could not be drawn</b><div style="margin-top:6px;color:#fda4af;font-size:12px">' + det.replace(/</g,'&lt;') + '</div><div style="margin-top:8px;color:#94a3b8;font-size:11px">Send /getapp and re-upload index.html.</div><div style="margin-top:10px"><button onclick="hideBootErr()" style="background:transparent;border:1px solid #fb7185;color:#fda4af;border-radius:9px;padding:6px 12px;font-size:12px">✕ Close</button></div>';
document.body.appendChild(box);
}
window.addEventListener('error', function(e){ showErr(e && e.message ? e.message : 'script error'); });
var tries = 0;
function check(){
tries++;
var v = document.getElementById('view');
if(v && v.innerHTML.replace(/\s/g,'').length > 0){ hideErr(); return; }
if(tries >= 6){ showErr('No content was rendered.'); return; }
setTimeout(check, 2000);
}
setTimeout(check, 4000);
})();
</script>
</body>
</html>
